<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Slowbatch Studio</title>
  <meta name="description" content="Get in touch with Slowbatch Studio.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Lato:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#efeae7',
            charcoal: '#2c2a29',
            accent: '#431407',
            'accent-dark': '#321003',
            'accent-light': '#e5dcd6',
          },
          fontFamily: {
            serif: ['Lora', 'Georgia', 'serif'],
            script: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['Lato', 'system-ui', 'sans-serif'],
          },
          maxWidth: {
            content: '480px',
          },
        },
      },
    };
  </script>

  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .brand-logo {
      letter-spacing: 0.22em;
    }

    .top-nav {
      border-bottom: 1px solid rgba(44, 42, 41, 0.1);
    }

    .nav-link {
      transition: color 0.2s ease;
    }

    .nav-link:hover {
      color: rgba(44, 42, 41, 0.55);
    }

    .nav-link.is-active {
      color: rgba(44, 42, 41, 0.55);
    }

    .form-input:focus,
    .form-textarea:focus {
      outline: none;
      border-color: #431407;
      box-shadow: 0 0 0 3px rgba(67, 20, 7, 0.12);
    }

    .submit-btn {
      transition: background-color 0.25s ease, transform 0.15s ease;
    }

    .submit-btn:hover {
      background-color: #321003;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body class="bg-cream text-charcoal font-sans font-light min-h-screen flex flex-col">

  <!-- Top Menu Bar -->
  <nav class="top-nav w-full bg-cream sticky top-0 z-40" aria-label="Main navigation">
    <div class="w-full max-w-content mx-auto px-6 py-4 flex flex-col items-center gap-4">
      <a href="index.html" class="brand-logo font-serif text-base sm:text-lg text-charcoal/90 font-medium lowercase shrink-0">
        slowbatch
      </a>

      <ul class="flex flex-wrap items-center justify-center gap-x-4 gap-y-2 sm:gap-x-6">
        <li>
          <a href="index.html" class="nav-link text-[11px] sm:text-xs tracking-wide lowercase text-charcoal/80">
            Home
          </a>
        </li>
        <li>
          <a href="contact.html" class="nav-link is-active text-[11px] sm:text-xs tracking-wide lowercase text-charcoal/80" aria-current="page">
            Contact
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <main class="flex-1 w-full max-w-content mx-auto px-6 py-14 sm:py-20 flex flex-col items-center">

    <header class="text-center mb-10 sm:mb-12 w-full">
      <h1 class="font-script italic text-2xl sm:text-[2rem] leading-snug text-charcoal/90 font-normal max-w-sm mx-auto mb-4">
        Get in touch
      </h1>
      <p class="text-sm text-charcoal/65 leading-relaxed max-w-xs mx-auto">
        Questions about the mail club, a custom order, or just want to say hello — I'd love to hear from you.
      </p>
    </header>

    <section class="w-full mb-12" aria-labelledby="contact-form-heading">
      <h2 id="contact-form-heading" class="sr-only">Contact form</h2>

      <form id="contact-form" class="w-full flex flex-col gap-4" novalidate>
        <div>
          <label for="name" class="block text-xs text-charcoal/60 mb-1.5 tracking-wide">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            required
            autocomplete="name"
            class="form-input w-full px-4 py-3.5 bg-transparent border border-charcoal/25 rounded-sm text-charcoal placeholder:text-charcoal/40 text-sm tracking-wide"
          >
        </div>

        <div>
          <label for="email" class="block text-xs text-charcoal/60 mb-1.5 tracking-wide">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            autocomplete="email"
            placeholder="your@email.com"
            class="form-input w-full px-4 py-3.5 bg-transparent border border-charcoal/25 rounded-sm text-charcoal placeholder:text-charcoal/40 text-sm tracking-wide"
          >
        </div>

        <div>
          <label for="message" class="block text-xs text-charcoal/60 mb-1.5 tracking-wide">Message</label>
          <textarea
            id="message"
            name="message"
            required
            rows="5"
            placeholder="What's on your mind?"
            class="form-textarea w-full px-4 py-3.5 bg-transparent border border-charcoal/25 rounded-sm text-charcoal placeholder:text-charcoal/40 text-sm tracking-wide resize-none"
          ></textarea>
        </div>

        <button
          type="submit"
          id="submit-btn"
          class="submit-btn w-full py-3.5 bg-accent text-cream text-sm font-medium tracking-widest uppercase rounded-sm mt-1"
        >
          Send Message
        </button>

        <!-- Honeypot: leave blank -->
        <input type="text" name="_honey" tabindex="-1" autocomplete="off" class="sr-only" aria-hidden="true">

        <p id="form-message" class="text-xs text-center hidden" role="status" aria-live="polite"></p>
      </form>
    </section>

    <div class="w-8 h-px bg-charcoal/15 mb-10" aria-hidden="true"></div>

    <section class="text-center w-full space-y-2">
      <p class="text-xs text-charcoal/55 mb-3">Or reach me directly</p>
      <a
        href="mailto:hello@slowbatchstudio.com"
        class="block text-sm text-charcoal/75 underline underline-offset-4 hover:text-charcoal transition-colors"
      >
        hello@slowbatchstudio.com
      </a>
      <a
        href="https://www.instagram.com/bycraftigail/"
        target="_blank"
        rel="noopener noreferrer"
        class="block text-sm text-charcoal/75 underline underline-offset-4 hover:text-charcoal transition-colors"
      >
        @bycraftigail on Instagram
      </a>
    </section>

  </main>

  <footer class="w-full max-w-content mx-auto px-6 pb-10 text-center">
    <p class="text-[11px] text-charcoal/40 tracking-wide flex items-center justify-center gap-1.5">
      <span aria-hidden="true">✦</span>
      <span>&copy; 2026 Slowbatch Studio</span>
      <span aria-hidden="true">✦</span>
    </p>
  </footer>

  <script>
    async function submitContactForm(data) {
      const response = await fetch('https://formsubmit.co/ajax/hello@slowbatchstudio.com', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json',
        },
        body: JSON.stringify({
          name: data.name,
          email: data.email,
          message: data.message,
          _subject: `Slowbatch Studio — message from ${data.name}`,
          _replyto: data.email,
          _template: 'table',
          _captcha: 'false',
        }),
      });

      if (!response.ok) throw new Error('Submission failed');
      return response.json();
    }

    const form = document.getElementById('contact-form');
    const submitBtn = document.getElementById('submit-btn');
    const formMessage = document.getElementById('form-message');

    function showMessage(text, type) {
      formMessage.textContent = text;
      formMessage.classList.remove('hidden', 'text-accent', 'text-red-600/70');
      formMessage.classList.add(type === 'success' ? 'text-accent' : 'text-red-600/70');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const name = form.name.value.trim();
      const email = form.email.value.trim();
      const message = form.message.value.trim();

      if (form._honey.value) return;

      if (!name || !email || !message || !form.email.checkValidity()) {
        showMessage('Please fill in all fields with a valid email.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';

      try {
        await submitContactForm({ name, email, message });
        showMessage('Thank you — your message has been sent.', 'success');
        form.reset();
      } catch (error) {
        console.error('Contact form error:', error);
        showMessage('Something went wrong. Please try again.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Message';
      }
    });
  </script>

</body>
</html>
